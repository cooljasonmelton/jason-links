<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal link hub for projects, writing, and social links.">
    <title>Jason Links</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="profile" aria-labelledby="profile-name">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" src="" alt="">
        </div>
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="profile-name"></h1>
        <p id="bio" class="bio"></p>
        <nav id="socials" class="socials" aria-label="Social links"></nav>
      </section>

      <section class="link-panel" aria-label="Featured links">
        <div id="links" class="links"></div>
      </section>

      <section id="editor" class="editor" aria-labelledby="editor-title" hidden>
        <div class="editor-header">
          <div>
            <p class="eyebrow">Local editor</p>
            <h2 id="editor-title">Edit preview data</h2>
          </div>
          <button id="close-editor" class="icon-button" type="button" aria-label="Close editor" title="Close editor">x</button>
        </div>
        <p class="editor-note">
          Changes here are saved only in this browser. To publish them, copy the generated config into <code>links.js</code>.
        </p>
        <textarea id="config-editor" spellcheck="false" aria-label="Editable profile and link config"></textarea>
        <div class="editor-actions">
          <button id="apply-config" type="button">Apply preview</button>
          <button id="copy-config" type="button">Copy config</button>
          <button id="reset-config" type="button">Reset preview</button>
        </div>
        <div class="stats">
          <h3>Local click counts</h3>
          <div id="stats-list"></div>
        </div>
      </section>
    </main>

    <a class="edit-link" href="#edit" aria-label="Open local editor" title="Open local editor">Edit</a>

    <script src="links.js"></script>
    <script src="app.js"></script>
  </body>
</html>
